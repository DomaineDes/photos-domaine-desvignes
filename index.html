<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domaine Desvignes — Photothèque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --plum: #80363a;
    --stone: #FAF7F2;
    --gold: #8A6D3A;
    --ink: #2A2420;
    --line: #D9D0BF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--stone);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  header {
    background: var(--plum);
    color: var(--stone);
    padding: 3rem 1.5rem 2.5rem;
    text-align: left;
  }
  header .wrap { max-width: 900px; margin: 0 auto; }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 3rem);
    margin: 0 0 0.5rem;
    letter-spacing: 0.01em;
  }
  header p {
    margin: 0;
    color: #CBB9A8;
    font-size: 1rem;
    max-width: 55ch;
    line-height: 1.5;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.5rem;
  }
  figure {
    margin: 0;
    background: #fff;
    border: 1px solid var(--line);
  }
  figure img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    background: #ddd;
    cursor: zoom-in;
  }
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 12, 15, 0.9);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 85vh;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .lightbox-close {
    position: absolute;
    top: 1.25rem;
    right: 1.5rem;
    background: none;
    border: none;
    color: var(--stone);
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  figcaption {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 1rem;
    border-top: 1px solid var(--line);
  }
  figcaption span {
    font-size: 0.9rem;
    color: var(--ink);
  }
  figcaption span em {
    font-style: italic;
    color: var(--ink);
  }
  a.download {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: var(--plum);
    text-decoration: none;
    border-bottom: 1px solid var(--gold);
    padding-bottom: 1px;
  }
  a.download:hover { color: var(--gold); }
  footer {
    text-align: left;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    color: #6B6155;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Domaine Desvignes</h1>
    <p>Photos du Domaine Desvignes, réservées à un usage commercial pour la promotion de nos vins.</p>
  </div>
</header>

<main>
  <div class="grid" id="gallery"></div>
</main>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<footer>
  Domaine Desvignes — Givry, Côte Chalonnaise
</footer>

<script>
  // ---------------------------------------------------------------
  // Pour ajouter ou retirer une photo : modifie simplement cette liste.
  // "file"  = nom du fichier dans le dossier photos/
  // "label" = texte affiché sous la photo (facultatif)
  // ---------------------------------------------------------------
  const photos = [
    { file: "domaine1.jpg", label: "Nos Vignes" },
    { file: "domaine2.jpg", label: "Nos Vignes" },
    { file: "domaine3.jpg", label: "Nos Vignes" },
    { file: "domaine4.jpg", label: "Nos Vignes" },
    { file: "gautier1.jpg", label: "Gautier" },
    { file: "gautier2.jpg", label: "Gautier" },
    { file: "gautier3.jpg", label: "Gautier" },
    { file: "gautier4.jpg", label: "Gautier" },
    { file: "gautier5.jpg", label: "Gautier" },
    { file: "gautier6.jpg", label: "Gautier" },
    { file: "gautier7.jpg", label: "Gautier" },
    { file: "gautier8.jpg", label: "Gautier" },
    { file: "gautier9.jpg", label: "Gautier" },
    { file: "gautier10.jpg", label: "Gautier" },
    { file: "bouteille1.png", label: "Givry Rouge" },
    { file: "bouteille2.png", label: "Givry Rouge <em>Champ la Dame</em>" },
    { file: "bouteille3.png", label: "Givry Rouge 1er cru <em>La Grande Berge</em>" },
    { file: "bouteille4.png", label: "Givry Rouge 1er cru <em>Ozymandias</em>" },
    { file: "bouteille5.png", label: "Givry Rouge 1er cru <em>Clos Charlé</em>" },
    { file: "bouteille6.png", label: "Givry Rouge 1er cru <em>Clos du Vernoy - Monopole</em>" },
    { file: "bouteille7.png", label: "Givry Blanc" },
    { file: "bouteille8.png", label: "Givry Blanc <em>En Chenèves</em>" },
    { file: "bouteille9.png", label: "Givry Blanc 1er cru <em>Les Grandes Vignes</em>" },
  ];

  const gallery = document.getElementById("gallery");
  photos.forEach(p => {
    const fig = document.createElement("figure");
    fig.innerHTML = `
      <img src="photos/${p.file}" alt="${p.label.replace(/<[^>]+>/g, '')}" loading="lazy" data-full="photos/${p.file}">
      <figcaption>
        <span>${p.label}</span>
        <a class="download" href="photos/${p.file}" download>télécharger</a>
      </figcaption>
    `;
    gallery.appendChild(fig);
  });

  // Ouvrir/fermer la visionneuse plein écran
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");

  gallery.addEventListener("click", e => {
    if (e.target.tagName === "IMG") {
      lightboxImg.src = e.target.dataset.full;
      lightboxImg.alt = e.target.alt;
      lightbox.classList.add("open");
    }
  });

  function closeLightbox() { lightbox.classList.remove("open"); }
  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

</script>

</body>
</html>
